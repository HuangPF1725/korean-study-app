<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自學韓語練習本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#1d2b2a;--mute:#5f706e;--line:#dbe4e2;--accent:#1a9384;--accent2:#e6f4f1;--warn:#c0573e;--ok:#2f8f4e;--ghost:#d6e2df;--shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2321;--ink:#e3ecea;--mute:#93a5a2;--line:#2c3835;--accent:#3cc0ae;--accent2:#1d3330;--warn:#e9866d;--ok:#5cc47c;--ghost:#2e3d3a;--shadow:none}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2321;--ink:#e3ecea;--mute:#93a5a2;--line:#2c3835;--accent:#3cc0ae;--accent2:#1d3330;--warn:#e9866d;--ok:#5cc47c;--ghost:#2e3d3a;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Noto Sans KR","Microsoft JhengHei","Malgun Gothic",sans-serif;line-height:1.6}
.ko{font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:auto;display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;margin-right:auto;cursor:pointer}
.logo span{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--mute);font-size:14px}
nav a.on{background:var(--accent2);color:var(--accent);font-weight:700}
main{max-width:1040px;margin:auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:18px;margin:20px 0 8px}h3{font-size:16px;margin:0 0 6px}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(var(--min,150px),1fr))}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.tabs button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
.tabs button.on,.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.say{border:none;background:var(--accent2);color:var(--accent);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px;flex:none;display:inline-grid;place-items:center}
.jamo{text-align:center;cursor:pointer;padding:10px 6px;position:relative}
.jamo .big{font-size:40px;line-height:1.2}
.jamo .rom{font-size:13px;color:var(--mute)}
.jamo.seen::after{content:"✓";position:absolute;top:4px;right:8px;color:var(--ok);font-size:12px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent2);color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .k{font-size:18px}
.row .z{color:var(--mute);font-size:14px}
.grow{flex:1;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--accent2);white-space:nowrap}
.tblwrap{overflow-x:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:16px}
.modal .card{max-width:760px;width:100%;margin-top:20px}
.close{float:right;border:none;background:none;font-size:22px;cursor:pointer;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.two{grid-template-columns:1fr}.jamo .big{font-size:32px}}
svg.stroke{width:100%;max-width:260px;aspect-ratio:1;display:block;margin:auto;background:var(--bg);border-radius:10px}
canvas.pad{width:100%;max-width:260px;aspect-ratio:1;display:block;margin:auto;border-radius:10px;touch-action:none;background:var(--bg);cursor:crosshair}
.center{text-align:center}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,var(--card))}
.flash{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center;user-select:none}
.flash .k{font-size:40px}
.hidezh .zh{visibility:hidden}.hideko .kk{filter:blur(6px)}
.hidezh .zh:hover,.hideko .kk:hover{visibility:visible;filter:none}
.line{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px}
.line.playing{background:var(--accent2)}
.spk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--accent)}
.spk.B{background:#c27c2c}
.q{font-weight:700}
.note{font-size:13px;color:var(--mute)}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.parts span{display:inline-block;margin:0 2px;padding:2px 8px;border-radius:6px;font-size:22px}
.p1{background:#f3d9a4;color:#5a3d00}.p2{background:#bfe3dc;color:#0d4a42}.p3{background:#f3c1c6;color:#6a1220}
.sel{display:flex;flex-wrap:wrap;gap:4px}
.sel button{min-width:38px;padding:4px 6px;font-size:18px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.sel button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
details{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:8px 0}
summary{padding:10px 14px;cursor:pointer;font-weight:700}
details>div{padding:0 14px 12px}
.ex{display:flex;gap:8px;align-items:center;padding:4px 0}
.star{border:none;background:none;cursor:pointer;font-size:18px;color:var(--mute)}
.star.on{color:#e0a800}
input[type=range]{accent-color:var(--accent)}
.right-float{float:right}
</style>
</head>
<body>
<header><div class="bar">
 <div class="logo" onclick="go('#home')">자학 <span>韓語</span> 練習本</div>
 <nav id="nav">
  <a href="#home">首頁</a><a href="#ch1">發音</a><a href="#ch2">語法</a><a href="#ch3">單字</a><a href="#ch4">會話</a><a href="#review">複習</a>
 </nav>
</div></header>
<main id="app"></main>
<div id="modal"></div>
<script>
// 內容依《全新自學韓語看完這本就能說》目錄架構編排；p = 書中對應頁碼
window.KR = {};

/* ========== 第一章 最簡單的韓語發音 ========== */
KR.vowels = [
 // 基本母音
 {c:'ㅏ',r:'a',z:'ㄚ',g:'基本',tip:'嘴巴自然張大，發「啊」的音。',w:'아이|孩子;바다|大海;나라|國家;가방|包包'},
 {c:'ㅓ',r:'eo',z:'ㄛ',g:'基本',tip:'嘴巴張開、舌頭後縮，嘴唇「不要」噘圓，介於「喔」與「餓」之間。',w:'어머니|母親;버스|公車;거기|那裡;서울|首爾'},
 {c:'ㅗ',r:'o',z:'ㄡ(圓唇)',g:'基本',tip:'嘴唇噘圓、向前突出，發「歐」但不要滑動。和ㅓ的差別在嘴唇是否圓。',w:'오리|鴨子;고기|肉;도로|道路;모자|帽子'},
 {c:'ㅜ',r:'u',z:'ㄨ',g:'基本',tip:'嘴唇收圓向前，發「烏」。',w:'우유|牛奶;구두|皮鞋;두부|豆腐;누나|姊姊(男稱)'},
 {c:'ㅡ',r:'eu',z:'ㄜ(扁唇)',g:'基本',tip:'嘴角往兩側拉、嘴唇扁平，舌頭放平，發類似「ㄜ」的音。',w:'그|那/他;크다|大;스키|滑雪;드라마|連續劇'},
 {c:'ㅣ',r:'i',z:'一',g:'基本',tip:'嘴角向兩側拉，發「衣」。',w:'이|二/牙齒;기차|火車;비|雨;미소|微笑'},
 {c:'ㅐ',r:'ae',z:'ㄝ',g:'基本',tip:'嘴巴比ㅔ張大一些，發「ㄝ」。現代首爾口語中ㅐ與ㅔ幾乎同音。',w:'개|狗;배|梨/船/肚子;새|鳥;애기|寶寶'},
 {c:'ㅔ',r:'e',z:'ㄝ',g:'基本',tip:'嘴巴微開，發「ㄝ」，不要帶「ㄟ」的尾音。',w:'게|螃蟹;세계|世界;메뉴|菜單;네|是/你的'},
 {c:'ㅚ',r:'oe',z:'ㄨㄝ',g:'基本',tip:'現代多讀成「we」(ㄨㄝ)，嘴唇先圓再展開。',w:'회사|公司;외국|外國;최고|最棒;뇌|腦'},
 {c:'ㅟ',r:'wi',z:'ㄨ一',g:'基本',tip:'由ㅜ快速滑到ㅣ，發「ㄨ一」，一拍完成。',w:'귀|耳朵;위|上面;쉬다|休息;가위|剪刀'},
 // 雙母音
 {c:'ㅑ',r:'ya',z:'一ㄚ',g:'雙母音',tip:'先發ㅣ立刻滑到ㅏ，「呀」。',w:'야구|棒球;약|藥;고양이|貓;샤워|淋浴'},
 {c:'ㅕ',r:'yeo',z:'一ㄛ',g:'雙母音',tip:'先發ㅣ再滑到ㅓ，嘴唇不圓。',w:'여자|女生;여기|這裡;겨울|冬天;혀|舌頭'},
 {c:'ㅛ',r:'yo',z:'一ㄡ',g:'雙母音',tip:'先發ㅣ再滑到ㅗ，嘴唇噘圓，「呦」。',w:'요리|料理;학교|學校;교수|教授;효도|孝道'},
 {c:'ㅠ',r:'yu',z:'一ㄨ',g:'雙母音',tip:'先發ㅣ再滑到ㅜ，「優」。',w:'유자|柚子;휴가|休假;규칙|規則;우유|牛奶'},
 {c:'ㅒ',r:'yae',z:'一ㄝ',g:'雙母音',tip:'先發ㅣ再滑到ㅐ。用字很少。',w:'얘기|談話;얘|這孩子;걔|那孩子'},
 {c:'ㅖ',r:'ye',z:'一ㄝ',g:'雙母音',tip:'先發ㅣ再滑到ㅔ。子音+ㅖ（ㅇ、ㄹ以外）口語常讀成ㅔ，如시계[시게]。',w:'예|是;시계|時鐘;계산|計算;예쁘다|漂亮'},
 {c:'ㅘ',r:'wa',z:'ㄨㄚ',g:'雙母音',tip:'ㅗ+ㅏ，「哇」。',w:'과자|餅乾;사과|蘋果;화가|畫家;와요|來'},
 {c:'ㅝ',r:'wo',z:'ㄨㄛ',g:'雙母音',tip:'ㅜ+ㅓ，「窩」。',w:'뭐|什麼;원|韓元;병원|醫院;더워요|很熱'},
 {c:'ㅙ',r:'wae',z:'ㄨㄝ',g:'雙母音',tip:'ㅗ+ㅐ，現代與ㅚ、ㅞ幾乎同音。',w:'왜|為什麼;돼지|豬;괜찮아요|沒關係'},
 {c:'ㅞ',r:'we',z:'ㄨㄝ',g:'雙母音',tip:'ㅜ+ㅔ，用字很少。',w:'웨이터|服務生;궤도|軌道;스웨터|毛衣'},
 {c:'ㅢ',r:'ui',z:'ㄜ一',g:'雙母音',tip:'ㅡ快速滑到ㅣ。字首讀[ㅢ]；子音+ㅢ讀[ㅣ]（희망[히망]）；字中讀[ㅣ]（회의[회이]）；作助詞「的」讀[ㅔ]。',w:'의사|醫生;의자|椅子;회의|會議;희망|希望'},
];

KR.consonants = [
 {c:'ㄱ',n:'기역',r:'g/k',z:'ㄍ',g:'平音',tip:'在字首接近「ㄎ」但較輕，在母音之間濁化為「g」。',w:'가구|家具;고기|肉;가방|包包;기자|記者'},
 {c:'ㄴ',n:'니은',r:'n',z:'ㄋ',g:'平音',tip:'舌尖抵上齒齦，發「ㄋ」。',w:'나무|樹;누나|姊姊(男稱);노래|歌;나라|國家'},
 {c:'ㄷ',n:'디귿',r:'d/t',z:'ㄉ',g:'平音',tip:'類似「ㄉ」，母音之間濁化。',w:'다리|腿;두부|豆腐;도시|都市;바다|大海'},
 {c:'ㄹ',n:'리을',r:'r/l',z:'ㄌ',g:'平音',tip:'舌尖輕彈上齒齦（似日語ら行）；作收尾音時舌尖貼住讀[l]。',w:'라면|泡麵;우리|我們;노래|歌;다리|腿'},
 {c:'ㅁ',n:'미음',r:'m',z:'ㄇ',g:'平音',tip:'雙唇閉合後發音，「ㄇ」。',w:'모자|帽子;머리|頭;엄마|媽媽;나무|樹'},
 {c:'ㅂ',n:'비읍',r:'b/p',z:'ㄅ',g:'平音',tip:'類似「ㄅ」，母音之間濁化為「b」。',w:'바다|大海;비|雨;바지|褲子;부부|夫婦'},
 {c:'ㅅ',n:'시옷',r:'s',z:'ㄙ',g:'平音',tip:'「ㄙ」；接ㅣ、ㅑ、ㅕ、ㅛ、ㅠ時讀近「ㄒ」。',w:'사자|獅子;소|牛;시계|時鐘;가수|歌手'},
 {c:'ㅇ',n:'이응',r:'－/ng',z:'(不發音)/ㄥ',g:'平音',tip:'放在字首不發音，只佔位置；作收尾音讀[ng]，像「ㄥ」。',w:'아이|孩子;우유|牛奶;오이|小黃瓜;강|江'},
 {c:'ㅈ',n:'지읒',r:'j',z:'ㄐ/ㄗ',g:'平音',tip:'介於「ㄐ」與「ㄗ」之間，不送氣。',w:'자두|李子;주스|果汁;지도|地圖;바지|褲子'},
 {c:'ㅊ',n:'치읓',r:'ch',z:'ㄑ/ㄘ',g:'激音',tip:'ㅈ的送氣音，發音時吐出強氣流。',w:'차|車/茶;치마|裙子;고추|辣椒;기차|火車'},
 {c:'ㅋ',n:'키읔',r:'k',z:'ㄎ',g:'激音',tip:'ㄱ的送氣音，「ㄎ」，氣流強。',w:'코|鼻子;커피|咖啡;키|身高;카드|卡片'},
 {c:'ㅌ',n:'티읕',r:'t',z:'ㄊ',g:'激音',tip:'ㄷ的送氣音，「ㄊ」。',w:'토마토|番茄;기타|吉他;타조|鴕鳥;투수|投手'},
 {c:'ㅍ',n:'피읖',r:'p',z:'ㄆ',g:'激音',tip:'ㅂ的送氣音，「ㄆ」。',w:'포도|葡萄;파|蔥;피자|披薩;우표|郵票'},
 {c:'ㅎ',n:'히읗',r:'h',z:'ㄏ',g:'激音',tip:'喉嚨吐氣，「ㄏ」但比中文輕。',w:'하나|一;허리|腰;휴지|衛生紙;하마|河馬'},
 {c:'ㄲ',n:'쌍기역',r:'kk',z:'緊ㄍ',g:'硬音',tip:'喉嚨緊繃、不送氣，像「嘎」用力且短促。',w:'까치|喜鵲;꼬리|尾巴;토끼|兔子;아까|剛才'},
 {c:'ㄸ',n:'쌍디귿',r:'tt',z:'緊ㄉ',g:'硬音',tip:'喉嚨緊繃、不送氣的ㄉ。',w:'딸기|草莓;또|又;머리띠|髮箍;따다|摘'},
 {c:'ㅃ',n:'쌍비읍',r:'pp',z:'緊ㄅ',g:'硬音',tip:'雙唇緊閉後用力爆開，不送氣。',w:'빵|麵包;오빠|哥哥(女稱);아빠|爸爸;뼈|骨頭'},
 {c:'ㅆ',n:'쌍시옷',r:'ss',z:'緊ㄙ',g:'硬音',tip:'舌頭緊、氣流細而強的ㄙ。',w:'싸다|便宜;쓰다|寫/苦;아저씨|大叔;비싸다|貴'},
 {c:'ㅉ',n:'쌍지읒',r:'jj',z:'緊ㄗ',g:'硬音',tip:'喉嚨緊繃、不送氣的ㅈ。',w:'짜다|鹹;찌개|鍋湯;가짜|假的;짝|一對'},
];

KR.finals = [
 {s:'ㄱ',r:'k',m:'ㄱ ㅋ ㄲ',tip:'舌根抵住軟顎，不爆破。',w:'책|書;국|湯;부엌|廚房;밖|外面'},
 {s:'ㄴ',r:'n',m:'ㄴ',tip:'舌尖抵上齒齦，像「安」的尾音。',w:'산|山;눈|眼睛/雪;돈|錢;문|門'},
 {s:'ㄷ',r:'t',m:'ㄷ ㅌ ㅅ ㅆ ㅈ ㅊ ㅎ',tip:'舌尖抵上齒齦停住，不爆破。',w:'곧|馬上;밭|田;옷|衣服;낮|白天;꽃|花'},
 {s:'ㄹ',r:'l',m:'ㄹ',tip:'舌尖輕貼上齒齦，讀[l]。',w:'물|水;달|月亮;발|腳;말|話/馬'},
 {s:'ㅁ',r:'m',m:'ㅁ',tip:'雙唇閉合，像閩南語「甘」的尾音。',w:'밤|夜晚/栗子;봄|春天;김치|泡菜;사람|人'},
 {s:'ㅂ',r:'p',m:'ㅂ ㅍ',tip:'雙唇閉合停住，不爆破。',w:'밥|飯;집|家;앞|前面;입|嘴巴'},
 {s:'ㅇ',r:'ng',m:'ㅇ',tip:'舌根抵軟顎，像「ㄥ」。',w:'강|江;방|房間;공|球;가방|包包'},

KR.soundChanges = [

KR.grammar1 = [
 {t:'韓語詞類總覽',p:124,b:'<p>韓語詞類分成五大類：</p><table><tr><th>體言</th><td>名詞、代名詞、數詞（可當主語、受詞）</td></tr><tr><th>用言</th><td>動詞、形容詞（當述語，詞尾會變化）</td></tr><tr><th>修飾言</th><td>冠形詞、副詞</td></tr><tr><th>獨立言</th><td>感嘆詞</td></tr><tr><th>關係言</th><td>助詞（黏在名詞後，標示文法角色）</td></tr></table><p>最重要的特點：<b>語序是「主語＋受詞＋動詞」(SOV)</b>，動詞永遠放在句尾，而詞的角色由<b>助詞</b>決定。</p>',ex:'저는 밥을 먹어요.|我吃飯。（我-主題 飯-受詞 吃）;친구가 학교에 가요.|朋友去學校。'},
 {t:'代名詞',p:127,b:'<table><tr><th>人稱</th><td>저/나 我（謙/平）・ 우리/저희 我們 ・ 당신/너 你 ・ 그 他 ・ 그녀 她</td></tr><tr><th>指示（物）</th><td>이것 這個 ・ 그것 那個（近聽者）・ 저것 那個（雙方都遠）</td></tr><tr><th>指示（地點）</th><td>여기 這裡 ・ 거기 那裡 ・ 저기 那裡（遠）</td></tr><tr><th>疑問</th><td>누구 誰 ・ 어디 哪裡 ・ 무엇(뭐) 什麼 ・ 언제 何時 ・ 왜 為什麼 ・ 어떻게 怎麼</td></tr></table><p>口語縮寫：이것→이거、저는→전、제가（저+가）、내가（나+가）。實際對話很少用「당신」，通常直接叫名字＋씨。</p>',ex:'이것은 뭐예요?|這是什麼？;화장실이 어디예요?|廁所在哪裡？;누구세요?|請問是哪位？'},
 {t:'數詞：漢字數詞與固有數詞',p:128,b:'<table><tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr><tr><th>漢字</th><td>일</td><td>이</td><td>삼</td><td>사</td><td>오</td><td>육</td><td>칠</td><td>팔</td><td>구</td><td>십</td></tr><tr><th>固有</th><td>하나</td><td>둘</td><td>셋</td><td>넷</td><td>다섯</td><td>여섯</td><td>일곱</td><td>여덟</td><td>아홉</td><td>열</td></tr></table><p><b>漢字數詞</b>：年、月、日、分、秒、金額、電話號碼、樓層、號碼。<br><b>固有數詞</b>：個數、人數、「點」（時）、歲數。<br>固有數詞接量詞時：하나→한、둘→두、셋→세、넷→네、스물→스무。</p>',ex:'사과 두 개 주세요.|請給我兩顆蘋果。;지금 세 시 십 분이에요.|現在三點十分。;이 가방은 삼만 원이에요.|這個包包三萬韓元。'},
 {t:'動詞與形容詞（用言）',p:132,b:'<p>用言的原形都以「<b>-다</b>」結尾，去掉다的部分叫<b>語幹</b>，各種文法都接在語幹後面。</p><table><tr><th>動詞</th><td>가다 去、먹다 吃、공부하다 讀書</td></tr><tr><th>形容詞</th><td>좋다 好、크다 大、예쁘다 漂亮</td></tr></table><p>韓語形容詞可以直接當述語，不需要「是」：날씨가 좋아요（天氣好）。很多詞是「名詞+하다」構成：공부+하다、운동+하다、행복+하다。</p>',ex:'날씨가 좋아요.|天氣很好。;동생이 공부해요.|弟弟在讀書。'},
 {t:'助詞 은/는（主題）・이/가（主格）',p:136,b:'<p>名詞最後一字<b>有收尾音</b>用前者，<b>沒有</b>用後者。</p><table><tr><th>은/는</th><td>標示話題、對比：「說到…」</td></tr><tr><th>이/가</th><td>標示主語、新資訊、疑問詞的答案</td></tr></table><p>나/저/누구＋가 → 내가/제가/누가。</p>',ex:'저는 학생이에요.|我是學生。;비가 와요.|下雨了。;누가 왔어요? 민수가 왔어요.|誰來了？敏洙來了。;사과는 좋아하지만 배는 안 좋아해요.|蘋果喜歡，梨子不喜歡。'},
 {t:'助詞 을/를（受格）・의（所有）',p:138,b:'<p><b>을/를</b>標示動作的對象（有收尾音用을）。<b>의</b>表示「的」，讀作[에]；저의→제、나의→내、너의→네。口語中의常省略：우리 엄마。</p>',ex:'커피를 마셔요.|喝咖啡。;책을 읽어요.|讀書。;이것은 제 가방이에요.|這是我的包包。'},
 {t:'助詞 에・에서・에게/한테',p:140,b:'<table><tr><th>에</th><td>時間點；目的地（가다/오다）；存在的地點（있다/없다）</td></tr><tr><th>에서</th><td>動作發生的地點；起點「從」</td></tr><tr><th>에게/한테</th><td>給「人」（한테較口語；對長輩用께）</td></tr></table>',ex:'학교에 가요.|去學校。;도서관에서 공부해요.|在圖書館讀書。;일곱 시에 일어나요.|七點起床。;친구에게 선물을 줬어요.|送了禮物給朋友。'},
 {t:'其他常用助詞',p:142,b:'<table><tr><th>와/과・하고・(이)랑</th><td>和、跟（와/과書面，하고/랑口語）</td></tr><tr><th>도</th><td>也</td></tr><tr><th>만</th><td>只</td></tr><tr><th>(으)로</th><td>方向「往」；手段「用、搭」（收尾音ㄹ或無收尾音用로）</td></tr><tr><th>부터…까지</th><td>（時間）從…到…</td></tr><tr><th>에서…까지</th><td>（地點）從…到…</td></tr><tr><th>보다</th><td>比</td></tr></table>',ex:'빵하고 우유를 샀어요.|買了麵包和牛奶。;저도 가요.|我也去。;지하철로 가요.|搭地鐵去。;아홉 시부터 여섯 시까지 일해요.|從九點工作到六點。'},
 {t:'이다／아니다・있다／없다',p:144,b:'<p><b>名詞+이에요/예요</b>：是（有收尾音用이에요）。<b>名詞+이/가 아니에요</b>：不是。<br><b>있어요/없어요</b>：有/沒有；在/不在。</p>',ex:'이것은 책이에요.|這是書。;저는 의사예요.|我是醫生。;저는 학생이 아니에요.|我不是學生。;시간이 있어요?|有時間嗎？'},
 {t:'終結語尾與說話等級',p:145,b:'<table><tr><th>原形</th><th>格式體（最正式）</th><th>非格式敬語（日常）</th><th>半語（親近）</th></tr><tr><td>가다</td><td>갑니다</td><td>가요</td><td>가</td></tr><tr><td>먹다</td><td>먹습니다</td><td>먹어요</td><td>먹어</td></tr><tr><td>하다</td><td>합니다</td><td>해요</td><td>해</td></tr></table><p><b>-아요/어요 規則</b>：語幹最後母音是ㅏ或ㅗ → -아요；其他 → -어요；하다 → 해요。母音相遇會縮合：가+아요→가요、오+아요→와요、마시+어요→마셔요、배우+어요→배워요。<br>格式體疑問：-ㅂ니까?/-습니까?</p>',ex:'만나서 반갑습니다.|很高興見到您。;어디에 가요?|你去哪裡？;뭐 먹어?|你吃什麼？'},
 {t:'時態：現在・過去・未來・進行',p:147,b:'<table><tr><th>現在</th><td>-아요/어요</td><td>먹어요</td></tr><tr><th>過去</th><td>-았/었/했어요</td><td>먹었어요</td></tr><tr><th>未來/打算</th><td>-(으)ㄹ 거예요</td><td>먹을 거예요</td></tr><tr><th>意志/推測</th><td>-겠-</td><td>먹겠어요</td></tr><tr><th>進行</th><td>-고 있어요</td><td>먹고 있어요</td></tr></table>',ex:'어제 영화를 봤어요.|昨天看了電影。;내일 부산에 갈 거예요.|明天要去釜山。;지금 밥을 먹고 있어요.|現在正在吃飯。'},
 {t:'否定句',p:149,b:'<table><tr><th>안 + 用言 ／ -지 않다</th><td>單純否定、不想做</td></tr><tr><th>못 + 動詞 ／ -지 못하다</th><td>能力或條件上「做不到」</td></tr><tr><th>-지 마세요</th><td>請不要…（命令的否定）</td></tr></table><p>「名詞+하다」動詞的안/못要放在하다前：공부 안 해요。</p>',ex:'저는 술을 안 마셔요.|我不喝酒。;오늘은 바쁘지 않아요.|今天不忙。;수영을 못 해요.|我不會游泳。;걱정하지 마세요.|請不要擔心。'},
 {t:'尊敬語',p:150,b:'<p>對長輩或陌生人，在語幹後加<b>-(으)시-</b>：가세요、읽으세요。主語助詞이/가→<b>께서</b>，에게→<b>께</b>。</p><table><tr><th>一般</th><th>尊敬</th></tr><tr><td>먹다/마시다</td><td>드시다</td></tr><tr><td>자다</td><td>주무시다</td></tr><tr><td>있다（在）</td><td>계시다</td></tr><tr><td>말하다</td><td>말씀하시다</td></tr><tr><td>집 / 나이 / 이름 / 밥</td><td>댁 / 연세 / 성함 / 진지</td></tr></table>',ex:'할머니께서 주무세요.|奶奶在睡覺。;선생님, 맛있게 드세요.|老師，請慢用。;성함이 어떻게 되세요?|請問您貴姓大名？'},
 {t:'修飾名詞的冠形詞形',p:151,b:'<table><tr><th></th><th>過去</th><th>現在</th><th>未來</th></tr><tr><th>動詞</th><td>-(으)ㄴ 본</td><td>-는 보는</td><td>-(으)ㄹ 볼</td></tr><tr><th>形容詞</th><td colspan="3">-(으)ㄴ：예쁜、작은</td></tr><tr><th>있다/없다</th><td colspan="3">-는：맛있는、재미없는</td></tr></table>',ex:'어제 본 영화|昨天看的電影;지금 보는 영화|現在在看的電影;내일 볼 영화|明天要看的電影;예쁜 꽃|漂亮的花'},
 {t:'常見不規則變化',p:151,b:'<table><tr><th>ㅂ不規則</th><td>덥다→더워요、춥다→추워요、맵다→매워요</td></tr><tr><th>ㄷ不規則</th><td>듣다→들어요、걷다→걸어요</td></tr><tr><th>ㅡ脫落</th><td>바쁘다→바빠요、크다→커요、쓰다→써요</td></tr><tr><th>르不規則</th><td>모르다→몰라요、부르다→불러요</td></tr><tr><th>ㄹ脫落</th><td>살다→삽니다/사세요、만들다→만드세요</td></tr><tr><th>ㅅ不規則</th><td>낫다→나아요、짓다→지어요</td></tr><tr><th>ㅎ不規則</th><td>빨갛다→빨개요、어떻다→어때요</td></tr></table>',ex:'오늘 너무 더워요.|今天好熱。;음악을 들어요.|聽音樂。;요즘 바빠요.|最近很忙。'},
];

<script>

const pick=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- storage (per-browser convenience) ---------- */

/* ---------- Hangul ---------- */
const INI='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',MED='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const FIN=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const compose=(i,v,f=0)=>String.fromCharCode(0xAC00+(INI.indexOf(i)*21+MED.indexOf(v))*28+(typeof f==='number'?f:FIN.indexOf(f)));
const decomp=ch=>{const c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return null;return[INI[c/588|0],MED[(c%588)/28|0],FIN[c%28]]};
const finIdx=w=>{const c=w.charCodeAt(w.length-1)-0xAC00;return c<0||c>11171?0:c%28};
const sylOf=j=>MED.includes(j)?compose('ㅇ',j):compose(j,'ㅏ');

/* ---------- speech ---------- */
let koVoice=null;
function loadVoices(){const vs=speechSynthesis.getVoices();const ko=vs.filter(v=>/^ko/i.test(v.lang));koVoice=ko.find(v=>/natural|online|google/i.test(v.name))||ko[0]||null;const w=$('#voicewarn');if(w)w.style.display=koVoice?'none':'block'}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}

const sayBtn=t=>`<button class="say" title="播放" onclick="event.stopPropagation();speak(this.dataset.t)" data-t="${esc(t)}">🔊</button>`;

/* ---------- stroke data (100×100) ---------- */

const ST={
 'ㅏ':[L(50,10,50,90),L(50,46,74,46)],'ㅓ':[L(26,46,50,46),L(50,10,50,90)],

 'ㅛ':[L(38,40,38,62),L(62,40,62,62),L(14,62,86,62)],'ㅠ':[L(14,40,86,40),L(38,40,38,72),L(62,40,62,72)],
 'ㅒ':[L(40,10,40,90),L(40,36,62,36),L(40,58,62,58),L(62,10,62,90)],'ㅖ':[L(22,36,44,36),L(22,58,44,58),L(44,10,44,90),L(66,10,66,90)],
 'ㅘ':[L(30,44,30,62),L(8,62,52,62),L(68,10,68,90),L(68,46,88,46)],'ㅝ':[L(8,40,54,40),L(31,40,31,72),L(52,54,70,54),L(70,10,70,90)],

};
const dbl=b=>{const m=(s,dx)=>s.o?O(dx+s.o[0]*.48,s.o[1],s.o[2]*.48):L(...s.p.map((v,i)=>i%2?v:dx+v*.48));return[...ST[b].map(s=>m(s,1)),...ST[b].map(s=>m(s,51))]};
ST['ㄲ']=dbl('ㄱ');ST['ㄸ']=dbl('ㄷ');ST['ㅃ']=dbl('ㅂ');ST['ㅆ']=dbl('ㅅ');ST['ㅉ']=dbl('ㅈ');
const pathD=(s,k=1)=>s.o?(([x,y,r])=>`M${x},${y-r} A${r},${r} 0 1 0 ${x},${y+r} A${r},${r} 0 1 0 ${x},${y-r}`)(s.o.map(v=>v*k)):'M'+s.p.reduce((a,v,i)=>a+(i%2?','+v*k:(i?' L':'')+v*k),'');
const start=s=>s.o?[s.o[0],s.o[1]-s.o[2]]:[s.p[0],s.p[1]];
function strokeSVG(j){const ss=ST[j]||[];return `<svg class="stroke" viewBox="0 0 100 100" id="svgS">
 <g stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/></g>
 <g fill="none" stroke="var(--ghost)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">${ss.map(s=>`<path d="${pathD(s)}"/>`).join('')}</g>
 <g fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="anim">${ss.map(s=>`<path d="${pathD(s)}"/>`).join('')}</g>
 <g class="nums" font-size="8" font-weight="700" text-anchor="middle">${ss.map((s,i)=>{const[x,y]=start(s);return `<g opacity="0"><circle cx="${x}" cy="${y}" r="5.5" fill="var(--warn)"/><text x="${x}" y="${y+2.8}" fill="#fff">${i+1}</text></g>`}).join('')}</g></svg>`}
function animStroke(){const ps=[...document.querySelectorAll('#svgS .anim path')],ns=[...document.querySelectorAll('#svgS .nums>g')];
 ps.forEach((p,i)=>{const l=p.getTotalLength();p.style.strokeDasharray=l;p.animate([{strokeDashoffset:l},{strokeDashoffset:0}],{duration:650,delay:i*800,fill:'both',easing:'ease-in-out'});ns[i].animate([{opacity:0},{opacity:1}],{duration:150,delay:i*800,fill:'both'})})}
function setupPad(j){const cv=$('#pad');const dpr=window.devicePixelRatio||1;const W=cv.clientWidth;cv.width=W*dpr;cv.height=W*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);const k=W/100;const css=getComputedStyle(document.documentElement);
 const bg=()=>{c.clearRect(0,0,W,W);c.strokeStyle=css.getPropertyValue('--line');c.setLineDash([4,4]);c.lineWidth=1;c.beginPath();c.moveTo(W/2,0);c.lineTo(W/2,W);c.moveTo(0,W/2);c.lineTo(W,W/2);c.stroke();c.setLineDash([]);
  c.strokeStyle=css.getPropertyValue('--ghost');c.lineWidth=8*k;c.lineCap='round';c.lineJoin='round';(ST[j]||[]).forEach(s=>{c.stroke(new Path2D(pathD(s,k)))})};
 bg();let down=false;c.strokeStyle=css.getPropertyValue('--ink');
 const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);const[x,y]=pos(e);c.strokeStyle=css.getPropertyValue('--ink');c.lineWidth=6*k;c.beginPath();c.moveTo(x,y)};
 cv.onpointermove=e=>{if(!down)return;const[x,y]=pos(e);c.lineTo(x,y);c.stroke()};
 cv.onpointerup=cv.onpointercancel=()=>down=false;
 $('#padclr').onclick=bg}

 ()=>{animStroke();setupPad(J.c)})}

/* ---------- generic quiz ---------- */
function runQuiz(el,qs,title,onDone){let i=0,score=0,wrong=[];
 const draw=()=>{if(i>=qs.length){el.innerHTML=`<div class="card center"><h2>${title} 完成！</h2><p style="font-size:28px">${score} / ${qs.length}</p>${wrong.length?`<h3>答錯的題目</h3>${wrong.map(w=>`<div class="row"><span class="grow ko">${w}</span></div>`).join('')}`:'<p>全對，太厲害了！🎉</p>'}<p><button class="btn pri" id="again">再做一次</button></p></div>`;$('#again').onclick=()=>onDone&&onDone(true);onDone&&onDone(false,score,qs.length);return}
  const q=qs[i];el.innerHTML=`<div class="card"><div class="prog"><i style="width:${i/qs.length*100}%"></i></div><p class="note">${title} ・ 第 ${i+1}/${qs.length} 題 ・ 得分 ${score}</p><div style="font-size:20px;margin:10px 0">${q.prompt}</div>${q.options.map((o,k)=>`<button class="opt ko" data-k="${k}">${esc(o)}</button>`).join('')}<div id="fb" class="note"></div></div>`;
  if(q.say)speak(q.say);
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=q.options[+b.dataset.k];el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.options[+x.dataset.k]===q.answer)x.classList.add('right')});
   if(o===q.answer){score++;q.onRight&&q.onRight()}else{b.classList.add('wrong');wrong.push(q.review||q.answer);q.onWrong&&q.onWrong()}
   $('#fb').innerHTML=(q.explain||'')+` <button class="btn pri" id="nx" style="margin-top:8px">下一題 →</button>`;$('#nx').onclick=()=>{i++;draw()};if(q.sayAfter)speak(q.sayAfter)})};
 draw()}
const opts=(ans,pool,n=4)=>shuffle([ans,...pick([...new Set(pool)].filter(x=>x!==ans),n-1)]);

  const draw=()=>{if(i>=deck.length){$('#fc').innerHTML=`<div class="card center"><h2>這一輪完成！</h2><p>已記住 ${Object.keys(K).length}/${W.length}</p><button class="btn pri" onclick="route()">再來一輪</button></div>`;return}const[k,z]=deck[i];
   $('#fc').innerHTML=`<div class="prog"><i style="width:${i/deck.length*100}%"></i></div><p class="note">${i+1}/${deck.length} ・ 點卡片翻面</p><div class="card flash" id="fl"><div class="k ko">${k}</div>${flip?`<div style="font-size:22px;margin-top:8px">${z}</div>`:'<div class="note">（想一想中文意思）</div>'}</div><p class="center"><button class="btn" onclick="speak('${k}')">🔊</button> <button class="btn" id="no">還不熟</button> <button class="btn pri" id="yes">記住了 ✓</button></p>`;
   $('#fl').onclick=()=>{flip=!flip;draw()};$('#no').onclick=()=>{S.weak[k]=z;save();deck.push(deck[i]);i++;flip=false;draw()};$('#yes').onclick=()=>{K[k]=1;delete S.weak[k];save();i++;flip=false;draw()};if(!flip)speak(k)};draw()}
 if(mode==='quiz'){const start=()=>{const qs=pick(W,Math.min(10,W.length)).map(([k,z])=>{const t=Math.random()*3|0;const onWrong=()=>{S.weak[k]=z;save()};
  if(t===0)return{prompt:`<span class="ko" style="font-size:34px">${k}</span> 是什麼意思？`,options:opts(z,W.map(x=>x[1])),answer:z,sayAfter:k,onWrong,review:k+' '+z};
  if(t===1)return{prompt:`「${z}」的韓文是？`,options:opts(k,W.map(x=>x[0])),answer:k,sayAfter:k,onWrong,review:k+' '+z};
  return{prompt:`聽音選意思 <button class="say" onclick="speak('${k}')">🔊</button>`,say:k,options:opts(z,W.map(x=>x[1])),answer:z,onWrong,explain:`<span class="ko">${k}</span>`,review:k+' '+z}});
  runQuiz($('#quiz'),qs,t.t+' 測驗',again=>again&&start())};start()}
}
function toggleKnown(n,k,b){const K=S.known[n]=S.known[n]||{};if(K[k])delete K[k];else{K[k]=1;delete S.weak[k]}save();b.classList.toggle('on',!!K[k])}

function ch4(n){
 if(n===undefined||n===''){app.innerHTML=`<h1>第四章 最常用的日常會話</h1><p class="sub">16 個生活場景：Step 1 場景短句、Step 2 情境對話。</p><div class="grid" style="--min:170px">${KR.conv.map((c,i)=>`<a class="card" href="#ch4/${i}" style="text-decoration:none;color:inherit"><div style="font-size:26px">${c.i}</div><h3>${S.scenes[i]?'✓ ':''}${i+1}. ${c.t}</h3><p class="note">p.${c.p}</p></a>`).join('')}</div>`;return}
 n=+n;const c=KR.conv[n];const sh=c.s.trim().split('\n').map(l=>l.split('|'));const dl=c.d.map(d=>d.trim().split('\n').map(l=>l.split('|')));
 app.innerHTML=`<p><a href="#ch4">← 全部場景</a>　${n>0?`<a href="#ch4/${n-1}">‹ 上一課</a>`:''}　${n<15?`<a href="#ch4/${n+1}">下一課 ›</a>`:''}</p><h1>${c.i} Unit ${String(n+1).padStart(2,'0')} ${c.t}</h1><p class="sub">書 p.${c.p}</p>
 <div class="tabs"><button onclick="$('#cv').classList.toggle('hidezh')">遮住中文</button><button onclick="$('#cv').classList.toggle('hideko')">遮住韓文（中翻韓練習）</button></div>
 <div id="cv"><h2><span class="tag">Step 1</span> 最常用的場景短句</h2><div class="card">${sh.map(([q,qz,a,az],i)=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="ex">${sayBtn(q)}<span><span class="ko q kk">${i+1}. ${q}</span> <span class="zh note">${qz}</span></span></div><div class="ex" style="padding-left:20px">${sayBtn(a)}<span><span class="tag">答</span> <span class="ko kk">${a}</span> <span class="zh note">${az}</span></span></div></div>`).join('')}</div>
 ${dl.map((d,di)=>`<h2><span class="tag">Step 2</span> 情境對話 ${di+1} <button class="btn" onclick="playDia(${di})">▶ 整段播放</button></h2><div class="card">${d.map(([s,k,z],li)=>`<div class="line" id="d${di}-${li}"><span class="spk ${s}">${s}</span><div class="grow"><div class="ko kk" style="font-size:17px">${k}</div><div class="zh note">${z}</div></div>${sayBtn(k)}</div>`).join('')}</div>`).join('')}</div>
 <p class="center" style="margin-top:16px"><button class="btn ${S.scenes[n]?'':'pri'}" id="done">${S.scenes[n]?'✓ 已完成（點擊取消）':'標記這課已完成'}</button></p>`;
 window.playDia=di=>{let i=0;const d=dl[di];const nx=()=>{document.querySelectorAll('.line').forEach(x=>x.classList.remove('playing'));if(i>=d.length)return;$(`#d${di}-${i}`).classList.add('playing');speak(d[i][1],()=>{i++;setTimeout(nx,500)})};nx()};
 $('#done').onclick=()=>{if(S.scenes[n])delete S.scenes[n];else S.scenes[n]=1;save();ch4(n)}
}

function review(){const weak=Object.entries(S.weak);
 app.innerHTML=`<h1>複習</h1><p class="sub">閃卡裡按「還不熟」或測驗答錯的單字會收進生詞本。</p>
 <div class="tabs"><button class="on" id="rq">🎯 生詞本測驗</button><button id="aq">🎲 全部單字隨機測驗</button></div><div id="quiz"></div>
 <h2>生詞本（${weak.length}）</h2><div class="card">${weak.length?weak.map(([k,z])=>`<div class="row">${sayBtn(k)}<span class="k ko grow">${k}</span><span class="z">${z}</span><button class="btn" onclick="delete S.weak['${k}'];save();review()">移除</button></div>`).join(''):'<p class="note">目前沒有生詞，太棒了！</p>'}</div>`;
 const all=allWords();
 const mk=list=>pick(list,Math.min(10,list.length)).map(({k,z})=>({prompt:`<span class="ko" style="font-size:34px">${k}</span> 是什麼意思？`,options:opts(z,all.map(x=>x.z)),answer:z,sayAfter:k,onRight:()=>{},onWrong:()=>{S.weak[k]=z;save()},review:k+' '+z}));
 $('#rq').onclick=()=>{const l=Object.entries(S.weak).map(([k,z])=>({k,z}));if(l.length<1){$('#quiz').innerHTML='<p class="note">生詞本是空的，先去做「全部單字隨機測驗」吧。</p>';return}runQuiz($('#quiz'),mk(l),'生詞本測驗',a=>a&&review())};
 $('#aq').onclick=()=>runQuiz($('#quiz'),mk(all),'隨機測驗',a=>a&&$('#aq').click());
}

/* ---------- router ---------- */
function route(){window.speechSynthesis&&speechSynthesis.cancel();const[p,a,b]=(location.hash||'#home').slice(1).split('/');
 document.querySelectorAll('#nav a').forEach(x=>x.classList.toggle('on',x.getAttribute('href')==='#'+p));
 ({home,ch1:()=>ch1(a),ch2:()=>ch2(a),ch3:()=>ch3(a,b),ch4:()=>ch4(a),review}[p]||home)();window.scrollTo(0,0)}
window.onhashchange=route;route();
</script>
</body>
</html>
